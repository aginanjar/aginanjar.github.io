<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ahmad Ginanjar, Web Developer.">
  <title>Ahmad Ginanjar — Web Developer</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #faf9f6;
      color: #242424;
      font-family: system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 52rem);
      padding: 2rem;
    }

    .avatar {
      display: block;
      width: 60px;
      height: 60px;
      flex: none;
      border-radius: 20%;
      image-rendering: pixelated;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.5rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    p {
      margin: 1rem 0 0;
      font-size: 1.25rem;
    }

    .tagline {
      margin-top: 0.5rem;
      color: #555;
      font-size: 1rem;
    }

    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin: 2.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    a {
      color: inherit;
      text-underline-offset: 0.2em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1><img class="avatar" src="styles/images/avatar.webp" alt="" width="72" height="72">Ahmad Ginanjar</h1>
    <p>Web Developer</p>
    <p class="tagline">Full-time Husband &amp; Father. Part-time Coder.</p>
    <nav aria-label="Contact">
      <ul>
        <li><a href="https://www.linkedin.com/in/aginanjarm/">LinkedIn</a></li>
        <li><a href="https://github.com/aginanjar">GitHub</a></li>
        <li><a href="mailto:ahmad.ginanjar.m@gmail.com">Email</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
